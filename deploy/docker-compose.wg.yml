name: noto

# noto behind WireGuard on a public VPS.
#
# Differs from docker-compose.prod.yml (the LXD/tailnet variant):
#   - traefik terminates TLS with a Let's Encrypt certificate obtained via the
#     DNS-01 challenge against Cloudflare. DNS-01 needs no inbound reachability,
#     which is the only option here: the Linode firewall drops everything except
#     WireGuard, so HTTP-01 can never complete.
#   - the embedding endpoint is the Mac's WireGuard address, not a tailnet name.
#
# Ports bind to ${WG_ADDR} rather than 0.0.0.0 on purpose. Docker publishes via
# DNAT/FORWARD and never traverses the INPUT chain, so host firewall rules do
# not protect published ports — binding to the tunnel interface does. The Linode
# Cloud Firewall (inbound DROP except UDP 51820) is the outer boundary.

services:
  traefik:
    image: traefik:v3.3
    container_name: noto-traefik
    restart: unless-stopped
    command:
      # File provider only — see traefik/dynamic-wg.yml for why there is no
      # docker provider and no docker socket.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # Check propagation against public resolvers: the host's own resolver may
      # not see the TXT record promptly, and ours strips private answers anyway.
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --log.level=INFO
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in .env}
    ports:
      - "${WG_ADDR:?set WG_ADDR in .env}:80:80"
      - "${WG_ADDR}:443:443"
    volumes:
      - ./traefik/dynamic-wg.yml:/etc/traefik/dynamic.yml:ro
      - ${NOTO_DATA:-/srv/noto-data}/acme:/acme
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg17
    container_name: noto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noto
      POSTGRES_DB: noto
      # Single tenant, loopback-bound, reachable only through the tunnel.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ${NOTO_DATA:-/srv/noto-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noto"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: ..
      dockerfile: src/Noto.Server/Dockerfile
    image: noto-app:latest
    container_name: noto-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Noto: "Host=db;Port=5432;Database=noto;Username=noto"
      Storage__MediaRoot: /data/media

      # Ollama runs on the Mac, reached over WireGuard. When the Mac is asleep
      # the worker fails and retries; the backlog shows on /admin and drains
      # the next time the tunnel is up.
      Embeddings__Endpoint: ${EMBEDDINGS_ENDPOINT:?set EMBEDDINGS_ENDPOINT in .env}
      Embeddings__RunWorker: "true"

      OpenRouter__ApiKey: ${OPENROUTER_KEY:-}
      Whisper__ApiKey: ${OPENAI_KEY:-}
    volumes:
      - ${NOTO_DATA:-/srv/noto-data}/media:/data/media
