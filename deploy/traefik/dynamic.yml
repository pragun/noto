# Traefik dynamic configuration (file provider, watched — edits apply live).
#
# The certificate is issued by `tailscale cert`, not by Traefik's ACME resolver:
# nothing here is reachable from the public internet, so the HTTP-01 challenge
# can never complete. Tailscale gets a real Let's Encrypt cert for the
# <host>.<tailnet>.ts.net name through its own control plane, which is why iOS
# trusts it and the PWA installs. A systemd timer on the host renews it; this
# file provider watches the directory and reloads without a restart.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/noto.crt
        keyFile: /certs/noto.key
  certificates:
    - certFile: /certs/noto.crt
      keyFile: /certs/noto.key
  options:
    default:
      minVersion: VersionTLS12

# Routing lives here rather than in docker labels. Traefik's docker provider
# negotiates an API version older than Docker 28 accepts ("client version 1.24
# is too old"), and with exactly one backend the provider bought nothing anyway.
# Dropping it also means Traefik no longer needs the docker socket, which is
# root-equivalent access to the host.
#
# No Host() match: this VM serves one app and is reachable only over the tailnet,
# so matching every hostname avoids threading the ts.net name into this file.
http:
  routers:
    noto:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: noto
      tls: {}
  services:
    noto:
      loadBalancer:
        servers:
          - url: "http://app:5100"
