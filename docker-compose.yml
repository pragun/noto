services:
  db:
    image: pgvector/pgvector:pg17
    container_name: noto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noto
      POSTGRES_PASSWORD: noto
      POSTGRES_DB: noto
    ports:
      - "5433:5432"
    volumes:
      - ${NOTO_DATA:-~/noto-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noto"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: noto-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${NOTO_DATA:-~/noto-data}/ollama:/root/.ollama

  app:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: noto-app
    restart: unless-stopped
    working_dir: /workspace
    command: /workspace/scripts/run.sh
    ports:
      - "5100:5100"   # HTTP
      - "5101:5101"   # HTTPS
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development env so unpublished static web assets are served correctly
      ASPNETCORE_ENVIRONMENT: Development
      # Container networking — override appsettings to talk to other services by name
      ConnectionStrings__Noto: "Host=db;Port=5432;Database=noto;Username=noto;Password=noto"
      Storage__MediaRoot: /data/media
      Embeddings__Endpoint: "http://ollama:11434/v1/embeddings"
      # API keys from .env (gitignored)
      OpenRouter__ApiKey: ${OPENROUTER_KEY:-}
      Whisper__ApiKey: ${OPENAI_KEY:-}
      # HTTPS cert path inside container
      Kestrel__Endpoints__Https__Certificate__Path: /certs/server.pfx
      Kestrel__Endpoints__Https__Certificate__Password: noto
    volumes:
      - .:/workspace:cached                                        # live source
      - ${NOTO_DATA:-~/noto-data}/media:/data/media                # photos, audio
      - ./certs:/certs:ro                                          # HTTPS cert
      - noto-nuget:/root/.nuget/packages                           # NuGet cache (persistent)
      - noto-bin:/workspace/src/Noto.Server/bin                    # build artifacts (fast)
      - noto-obj:/workspace/src/Noto.Server/obj

  caddy:
    image: caddy:2-alpine
    container_name: noto-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

volumes:
  noto-nuget:
  noto-bin:
  noto-obj:
