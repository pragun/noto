<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>nōto · capture</title>
    <link href="/lib/fonts/jetbrains-mono.css" rel="stylesheet">
    <style>
        :root { --charcoal:#2e2e2e; --slate:#636e72; --slate-2:#8a9ba8; --matcha:#7a9e7e; --matcha-2:#a8c5aa; --matcha-dim:#4a6b4e; --parchment:#f4efe4; --chalk:#dad4c8; --amber:#C4A35A; --red:#b04040; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'JetBrains Mono',monospace; background:var(--parchment); color:var(--charcoal); font-size:14px; min-height:100vh; -webkit-text-size-adjust:100%; }

        .header { padding:14px 20px; border-bottom:1px solid var(--chalk); display:flex; align-items:center; gap:8px; }
        .brand { font-size:15px; font-weight:500; letter-spacing:0.04em; }
        .sub { font-size:9px; color:var(--slate); letter-spacing:0.12em; text-transform:uppercase; }
        .mode-toggle { margin-left:auto; display:flex; align-items:center; gap:6px; }
        .mode-btn { font-family:inherit; font-size:9px; letter-spacing:0.08em; padding:4px 10px; border:1px solid var(--chalk); background:transparent; color:var(--slate); cursor:pointer; -webkit-tap-highlight-color:transparent; }
        .mode-btn.offline { background:rgba(176,64,64,0.1); border-color:rgba(176,64,64,0.3); color:var(--red); }
        .mode-btn.online { background:rgba(122,158,126,0.15); border-color:var(--matcha); color:var(--matcha-dim); }
        .queue-count { font-size:9px; padding:3px 8px; background:rgba(196,163,90,0.15); border:1px solid rgba(196,163,90,0.3); color:#8B6914; cursor:pointer; }

        .view-tabs { display:flex; border-bottom:2px solid var(--chalk); }
        .view-tab { flex:1; padding:12px 0; text-align:center; font-family:inherit; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; background:none; border:none; border-bottom:2px solid transparent; color:var(--slate); cursor:pointer; margin-bottom:-2px; -webkit-tap-highlight-color:transparent; }
        .view-tab.active { color:var(--matcha-dim); border-bottom-color:var(--matcha); }

        .view { display:none; }
        .view.active { display:block; }

        textarea, input[type=text] { width:100%; font-family:inherit; font-size:15px; color:var(--charcoal); background:rgba(255,255,255,0.55); border:1px solid var(--chalk); padding:12px 14px; outline:none; -webkit-appearance:none; }
        textarea { min-height:100px; resize:vertical; line-height:1.8; }
        textarea:focus, input:focus { border-color:var(--matcha-2); }
        textarea::placeholder, input::placeholder { color:var(--chalk); }
        .title-input { background:transparent; border:none; border-bottom:1px solid var(--chalk); padding:8px 0; font-size:12px; }

        .btn { font-family:inherit; font-size:11px; padding:10px 16px; border:1px solid var(--chalk); background:transparent; color:var(--slate); cursor:pointer; -webkit-tap-highlight-color:transparent; }
        .btn:active { background:rgba(0,0,0,0.03); }
        .btn-primary { width:100%; padding:16px; background:var(--matcha); border:none; color:var(--charcoal); font-size:13px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; }
        .btn-primary:disabled { opacity:0.4; }
        .btn-primary.queue-style { background:var(--amber); }
        .btn-danger { border-color:rgba(176,64,64,0.3); color:var(--red); }
        .btn-row { display:flex; gap:8px; }

        /* ── Capture form ── */
        .cap-form { padding:20px; }
        .cap-section { margin-bottom:16px; }
        .cap-section-label { font-size:8px; letter-spacing:0.15em; text-transform:uppercase; color:var(--slate); margin-bottom:6px; }

        .add-btns { display:flex; gap:8px; margin-bottom:16px; }
        .add-btn { flex:1; padding:12px; border:2px dashed var(--chalk); background:transparent; font-family:inherit; font-size:11px; color:var(--slate); cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }
        .add-btn:active { border-color:var(--matcha); }

        /* Attachments list */
        .att-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
        .att-item { display:flex; align-items:center; gap:10px; padding:8px 10px; background:rgba(255,255,255,0.5); border:1px solid var(--chalk); }
        .att-item img { width:60px; height:60px; object-fit:cover; border:1px solid var(--chalk); }
        .att-item audio { flex:1; height:32px; }
        .att-item .att-info { flex:1; font-size:10px; color:var(--slate); overflow:hidden; }
        .att-remove { font-size:16px; color:var(--slate); cursor:pointer; padding:4px 8px; -webkit-tap-highlight-color:transparent; }
        .att-remove:active { color:var(--red); }

        /* Recording */
        .rec-overlay { position:fixed; inset:0; background:rgba(46,46,46,0.9); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .rec-dot { width:16px; height:16px; border-radius:50%; background:var(--red); animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.1)} }
        .rec-time { font-size:32px; font-weight:300; color:var(--parchment); margin:16px 0; }
        .rec-stop { padding:16px 40px; background:var(--red); border:none; color:var(--parchment); font-family:inherit; font-size:14px; cursor:pointer; }

        /* Success */
        .success { text-align:center; padding:50px 20px; }
        .success-icon { width:48px; height:48px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:22px; color:var(--charcoal); }

        /* Queue */
        .queue-panel { padding:16px 20px; }

        /* Mode tabs — note / rec / seed. Each mode reveals only its own fields;
           the stored entity is the same shape either way. */
        .mode-tabs { display:flex; gap:6px; padding:8px 20px 0; }
        .mode-tab {
            flex:1; padding:7px 0; font-family:inherit; font-size:10px; letter-spacing:0.08em;
            background:transparent; border:1px solid var(--chalk); color:var(--slate); cursor:pointer;
        }
        .mode-tab.active { background:var(--charcoal); color:var(--parchment); border-color:var(--charcoal); }
        .field-label { font-size:9px; letter-spacing:0.1em; color:var(--slate); margin:10px 0 4px; }
        .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
        .chip {
            padding:6px 11px; font-family:inherit; font-size:11px; cursor:pointer;
            background:rgba(255,255,255,0.55); border:1px solid var(--chalk); color:var(--charcoal);
        }
        .chip.on { background:var(--matcha); color:#fff; border-color:var(--matcha); }
        .recent-row { font-size:9px; color:var(--slate); margin-top:5px; }
        .recent-row span { cursor:pointer; text-decoration:underline; margin-right:8px; }
        /* Thread picker: one thread per song means a growing list, so it
           searches rather than being a dropdown. */
        .thread-list { max-height:150px; overflow-y:auto; border:1px solid var(--chalk); background:rgba(255,255,255,0.45); }
        .thread-item { padding:8px 10px; font-size:11px; display:flex; gap:8px; align-items:center; cursor:pointer; border-bottom:1px solid rgba(218,212,200,0.5); }
        .thread-item:last-child { border-bottom:none; }
        .thread-item.on { background:rgba(122,158,126,0.18); }
        .thread-item .dot { width:7px; height:7px; border-radius:50%; border:1px solid var(--slate); flex:none; }
        .thread-item.on .dot { background:var(--matcha); border-color:var(--matcha); }
        .thread-item .when { margin-left:auto; font-size:9px; color:var(--slate); }
        .group-head { font-size:10px; letter-spacing:0.12em; color:var(--charcoal); margin:16px 0 6px; display:flex; }
        .group-head .n { margin-left:auto; color:var(--slate); }
        .rec-row { padding:6px 0 6px 10px; font-size:11px; border-left:1px solid var(--chalk); display:flex; gap:6px; }
        .rec-row .meta { margin-left:auto; font-size:9px; color:var(--slate); }
        .q-item { background:rgba(255,255,255,0.55); border:1px solid var(--chalk); border-left:3px solid var(--amber); padding:10px 12px; margin-bottom:8px; }
        .q-type { font-size:8px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber); }
        .q-text { font-size:11px; color:var(--charcoal); line-height:1.5; margin:4px 0; max-height:40px; overflow:hidden; }
        .q-photos { display:flex; gap:4px; margin:4px 0; }
        .q-photos img { width:40px; height:40px; object-fit:cover; border:1px solid var(--chalk); }
        .q-time { font-size:8px; color:var(--slate); }
        .q-actions { display:flex; gap:6px; margin-top:6px; }

        .empty-msg { text-align:center; padding:40px; color:var(--slate); font-size:11px; }
        .hidden { display:none !important; }
    </style>
</head>
<body>

<div class="header">
    <span class="brand">nōto</span>
    <span class="sub">capture</span>
    <span id="ver" style="font-size:7px; color:rgba(99,110,114,0.4); margin-left:4px; align-self:flex-end;"></span>
    <div class="mode-toggle">
        <span id="queue-count" class="queue-count hidden" onclick="showView('queue')"></span>
        <button id="mode-btn" class="mode-btn online" onclick="toggleMode()">online</button>
    </div>
</div>

<div class="view-tabs">
    <button class="view-tab active" onclick="showView('capture')">capture</button>
    <button class="view-tab" onclick="showView('recs')">recs</button>
    <button class="view-tab" onclick="showView('queue')">queue</button>
</div>

<div id="error" style="color:var(--red); font-size:11px; padding:8px 20px; display:none;"></div>

<!-- ── CAPTURE VIEW ── -->
<div id="view-capture" class="view active">
    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="note" onclick="setMode('note')">note</button>
        <button class="mode-tab" data-mode="rec" onclick="setMode('rec')">rec</button>
        <button class="mode-tab" data-mode="seed" onclick="setMode('seed')">seed</button>
    </div>
    <div class="cap-form">
        <!-- rec: who recommended what, and what kind of thing. Stored as fields
             so the browse screen can regroup by person / kind / date. -->
        <div id="fields-rec" class="cap-section hidden">
            <div class="field-label">from</div>
            <input type="text" id="rec-from" class="title-input" placeholder="who recommended it" oninput="checkSubmit()">
            <div id="rec-recent" class="recent-row"></div>
            <div class="field-label">kind</div>
            <div class="chip-row" id="rec-kind">
                <button class="chip" onclick="pickChip(this,'rec-kind')" data-v="book">book</button>
                <button class="chip" onclick="pickChip(this,'rec-kind')" data-v="film">film</button>
                <button class="chip" onclick="pickChip(this,'rec-kind')" data-v="music">music</button>
                <button class="chip" onclick="pickChip(this,'rec-kind')" data-v="place">place</button>
                <button class="chip" onclick="pickChip(this,'rec-kind')" data-v="other">other</button>
            </div>
        </div>

        <!-- seed: a fragment belongs to a song, and that song may not exist yet. -->
        <div id="fields-seed" class="cap-section hidden">
            <div class="field-label">song</div>
            <input type="text" id="seed-search" class="title-input" placeholder="search songs, or type a new name" oninput="renderThreads()">
            <div id="thread-list" class="thread-list"></div>
            <div class="field-label">form</div>
            <div class="chip-row" id="seed-form">
                <button class="chip" onclick="pickChip(this,'seed-form')" data-v="lyric">lyric</button>
                <button class="chip" onclick="pickChip(this,'seed-form')" data-v="melody">melody</button>
                <button class="chip" onclick="pickChip(this,'seed-form')" data-v="fragment">fragment</button>
            </div>
        </div>

        <div class="cap-section">
            <div id="tpl-wrap" style="margin-bottom:6px;">
                <select id="tpl-select" onchange="applyTemplate(this)" style="background:rgba(255,255,255,0.55); border:1px solid var(--chalk); font-family:inherit; font-size:10px; color:var(--charcoal); padding:3px 6px; outline:none;">
                    <option value="">template...</option>
                </select>
            </div>
            <textarea id="cap-body" placeholder="what's on your mind..." oninput="checkSubmit()"></textarea>
            <input type="text" id="cap-title" class="title-input" placeholder="title (optional)" style="margin-top:8px;" oninput="checkSubmit()">
        </div>

        <div class="add-btns">
            <label class="add-btn">
                <input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this)" style="display:none;">
                ⊡ photo
            </label>
            <button class="add-btn" onclick="startRecording()">◎ voice</button>
        </div>

        <div id="att-list" class="att-list"></div>

        <div id="edit-bar" class="hidden" style="margin-bottom:8px;">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
                <button class="btn" onclick="cancelEdit()">cancel</button>
                <span style="flex:1; font-size:9px; color:var(--amber);">editing queued item</span>
                <button class="btn btn-danger" onclick="deleteEditing()">delete from queue</button>
            </div>
        </div>
        <button class="btn btn-primary" id="cap-submit" disabled onclick="submitCapture()">capture</button>
    </div>
</div>

<!-- ── RECORDING OVERLAY ── -->
<div id="rec-overlay" class="rec-overlay hidden">
    <div class="rec-dot"></div>
    <div class="rec-time" id="rec-time">0:00</div>
    <button class="rec-stop" onclick="stopRecording()">stop</button>
</div>

<!-- ── SUCCESS VIEW ── -->
<div id="view-success" class="view">
    <div class="success">
        <div class="success-icon" id="suc-icon" style="background:var(--matcha);">✓</div>
        <div id="suc-text" style="font-size:14px; margin-top:10px;">captured</div>
        <div id="suc-detail" style="font-size:10px; color:var(--slate); margin-top:4px;"></div>
        <div class="btn-row" style="justify-content:center; margin-top:16px;">
            <button class="btn" onclick="resetCapture()">another</button>
        </div>
    </div>
</div>

<!-- ── RECS VIEW ──
     Same rows, three lenses — only possible because from/kind are fields
     rather than folder names. -->
<div id="view-recs" class="view">
    <div class="queue-panel">
        <div class="chip-row" style="margin-bottom:4px;">
            <button class="chip on" onclick="setRecGroup(this,'from')">by person</button>
            <button class="chip" onclick="setRecGroup(this,'kind')">by kind</button>
            <button class="chip" onclick="setRecGroup(this,'date')">by date</button>
        </div>
        <div id="recs-body"></div>
    </div>
</div>

<!-- ── QUEUE VIEW ── -->
<div id="view-queue" class="view">
    <div class="queue-panel">
        <div id="q-storage" style="font-size:9px; color:var(--slate); margin-bottom:12px; padding:8px 10px; background:rgba(0,0,0,0.03); border:1px solid var(--chalk);"></div>
        <div id="q-list"></div>
        <div id="q-empty" class="empty-msg">queue is empty</div>
        <div id="q-actions" class="hidden" style="margin-top:12px;">
            <button class="btn btn-primary" onclick="syncQueue()">sync all to server</button>
            <button class="btn btn-danger" onclick="clearQueue()" style="margin-top:8px; width:100%;">clear entire queue</button>
        </div>
    </div>
</div>


<script>
// ── State ──
var offlineMode = false;
var captureMode = 'note';      // note | rec | seed
var threads = [];              // cached from /api/threads, refreshed on load
var selectedThreads = [];      // thread ids to tag this capture into
var newThreadName = null;      // a song being started that does not exist yet
var recentPeople = [];         // learned from what you have already typed
var recGroup = 'from';
var queue = []; // loaded from IndexedDB on init
var attachments = [];
var editingIdx = -1;
var idb = null; // IndexedDB handle

// ── IndexedDB ──
function openIDB() {
    return new Promise(function(resolve, reject) {
        if (idb) { resolve(idb); return; }
        var req = indexedDB.open('noto-capture', 2);
        req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('queue')) {
                db.createObjectStore('queue', { keyPath: 'id' });
            }
        };
        req.onsuccess = function(e) { idb = e.target.result; resolve(idb); };
        req.onerror = function(e) { reject(new Error('IndexedDB: ' + (e.target.error || 'failed'))); };
    });
}

function idbGetAll() {
    return openIDB().then(function(db) {
        return new Promise(function(resolve, reject) {
            var tx = db.transaction('queue', 'readonly');
            var req = tx.objectStore('queue').getAll();
            req.onsuccess = function() { resolve(req.result || []); };
            req.onerror = function() { resolve([]); };
        });
    });
}

function idbPut(item) {
    return openIDB().then(function(db) {
        return new Promise(function(resolve, reject) {
            var tx = db.transaction('queue', 'readwrite');
            tx.objectStore('queue').put(item);
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function(e) { reject(new Error('IDB write failed: ' + (e.target.error || 'unknown'))); };
        });
    });
}

function idbDelete(id) {
    return openIDB().then(function(db) {
        return new Promise(function(resolve, reject) {
            var tx = db.transaction('queue', 'readwrite');
            tx.objectStore('queue').delete(id);
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { resolve(); }; // don't fail on delete
        });
    });
}

function idbClear() {
    return openIDB().then(function(db) {
        return new Promise(function(resolve) {
            var tx = db.transaction('queue', 'readwrite');
            tx.objectStore('queue').clear();
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { resolve(); };
        });
    });
}

async function idbEstimateUsage() {
    if (navigator.storage && navigator.storage.estimate) {
        var est = await navigator.storage.estimate();
        return { used: est.usage || 0, quota: est.quota || 0 };
    }
    return { used: 0, quota: 0 };
}

// ── Mode ──
function toggleMode() {
    offlineMode = !offlineMode;
    var b = document.getElementById('mode-btn');
    b.textContent = offlineMode ? 'offline' : 'online';
    b.className = 'mode-btn ' + (offlineMode ? 'offline' : 'online');
}

// ── Capture modes ──
// The three modes write the same entity shape; they differ only in which
// fields are on screen and what lands in meta.
function setMode(mode) {
    captureMode = mode;
    document.querySelectorAll('.mode-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.mode === mode);
    });
    document.getElementById('fields-rec').classList.toggle('hidden', mode !== 'rec');
    document.getElementById('fields-seed').classList.toggle('hidden', mode !== 'seed');
    // The template picker is noise in the structured modes.
    document.getElementById('tpl-wrap').classList.toggle('hidden', mode !== 'note');

    var body = document.getElementById('cap-body');
    var title = document.getElementById('cap-title');
    if (mode === 'rec') {
        title.placeholder = 'what — the book, film, record, place';
        body.placeholder = 'why / context — what did they say about it?';
    } else if (mode === 'seed') {
        title.placeholder = 'title (optional)';
        body.placeholder = 'the line, the image, the idea...';
    } else {
        title.placeholder = 'title (optional)';
        body.placeholder = "what's on your mind...";
    }
    if (mode === 'seed') renderThreads();
    if (mode === 'rec') renderRecentPeople();
    checkSubmit();
}

// Single-select chip groups (kind, form).
function pickChip(el, groupId) {
    var group = document.getElementById(groupId);
    var wasOn = el.classList.contains('on');
    group.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('on'); });
    if (!wasOn) el.classList.add('on');
    checkSubmit();
}
function chipValue(groupId) {
    var on = document.querySelector('#' + groupId + ' .chip.on');
    return on ? on.dataset.v : null;
}

// ── Threads ──
function timeAgo(iso) {
    if (!iso) return '';
    var d = (Date.now() - new Date(iso).getTime()) / 86400000;
    if (d < 1) return 'today';
    if (d < 2) return '1d';
    if (d < 31) return Math.floor(d) + 'd';
    return Math.floor(d / 30) + 'mo';
}

function renderThreads() {
    var q = (document.getElementById('seed-search').value || '').trim().toLowerCase();
    var list = document.getElementById('thread-list');
    var matches = threads.filter(function(t) {
        return !q || (t.title || '').toLowerCase().includes(q);
    });

    var html = matches.map(function(t) {
        var on = selectedThreads.indexOf(t.id) >= 0;
        return '<div class="thread-item' + (on ? ' on' : '') + '" onclick="toggleThread(\'' + t.id + '\')">'
            + '<span class="dot"></span><span>' + esc(t.title || 'untitled') + '</span>'
            + '<span class="when">' + timeAgo(t.lastAt) + '</span></div>';
    }).join('');

    // Typing a name that matches nothing offers to start it — a song can begin
    // on a hillside without a trip to the desktop.
    if (q && !matches.some(function(t) { return (t.title || '').toLowerCase() === q; })) {
        var on = newThreadName !== null;
        html += '<div class="thread-item' + (on ? ' on' : '') + '" onclick="toggleNewThread()">'
            + '<span class="dot"></span><span>+ new: ' + esc(document.getElementById('seed-search').value.trim()) + '</span></div>';
    }
    list.innerHTML = html || '<div class="thread-item" style="color:var(--slate);">no songs yet — type a name to start one</div>';
}

function toggleThread(id) {
    var i = selectedThreads.indexOf(id);
    if (i >= 0) selectedThreads.splice(i, 1); else selectedThreads.push(id);
    renderThreads();
    checkSubmit();
}

function toggleNewThread() {
    var name = document.getElementById('seed-search').value.trim();
    newThreadName = (newThreadName === null && name) ? name : null;
    renderThreads();
    checkSubmit();
}

function renderRecentPeople() {
    var el = document.getElementById('rec-recent');
    if (!el) return;
    el.innerHTML = recentPeople.length
        ? 'recent: ' + recentPeople.slice(0, 6).map(function(p) {
            return '<span onclick="setPerson(\'' + esc(p).replace(/'/g, "\\'") + '\')">' + esc(p) + '</span>';
          }).join('')
        : '';
}
function setPerson(p) {
    document.getElementById('rec-from').value = p;
    checkSubmit();
}

// ── Views ──
function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    var tab = document.querySelector('.view-tab[onclick*="' + name + '"]');
    if (tab) tab.classList.add('active');
    if (name === 'queue') renderQueue();
    if (name === 'recs') loadRecs();
}

function showErr(msg) {
    var el = document.getElementById('error');
    el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}

// ── Attachments ──
function addPhotos(input) {
    Array.from(input.files).forEach(function(file) {
        var src = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function() {
            // Make thumbnail
            var c = document.createElement('canvas');
            var sz = 120;
            c.width = sz; c.height = sz;
            var ctx = c.getContext('2d');
            var s = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, sz, sz);
            var thumb = c.toDataURL('image/jpeg', 0.5);
            URL.revokeObjectURL(src);
            attachments.push({ type:'photo', blob:file, mime:file.type, name:file.name, thumb:thumb });
            renderAttachments();
            checkSubmit();
        };
        img.onerror = function() { URL.revokeObjectURL(src); showErr('could not read ' + (file.name||'photo')); };
        img.src = src;
    });
    input.value = '';
}

function removeAtt(idx) {
    if (attachments[idx].blobUrl) URL.revokeObjectURL(attachments[idx].blobUrl);
    attachments.splice(idx, 1);
    renderAttachments();
    checkSubmit();
}

function renderAttachments() {
    var el = document.getElementById('att-list');
    if (!attachments.length) { el.innerHTML = ''; return; }
    el.innerHTML = attachments.map(function(a, i) {
        if (a.type === 'photo') {
            return '<div class="att-item"><img src="' + a.thumb + '"><div class="att-info">' + (a.name||'photo') + '</div><span class="att-remove" onclick="removeAtt('+i+')">&times;</span></div>';
        } else {
            return '<div class="att-item"><audio controls src="' + a.blobUrl + '"></audio><span class="att-remove" onclick="removeAtt('+i+')">&times;</span></div>';
        }
    }).join('');
}

function checkSubmit() {
    var hasText = document.getElementById('cap-body').value.trim().length > 0;
    var hasTitle = document.getElementById('cap-title').value.trim().length > 0;
    var hasAtt = attachments.length > 0;
    // In rec mode the title *is* the thing being recommended, so it alone is
    // enough — you can note "Stoner, from Rachel" without writing a review.
    var ok = (captureMode === 'rec') ? (hasTitle || hasText) : (hasText || hasTitle || hasAtt);
    document.getElementById('cap-submit').disabled = !ok;
}

// ── Recording ──
var mediaRec = null, audioChunks = [], recTimer = null, recSec = 0;

// Detect best audio format for this browser
var audioMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
    : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
    : '';
var audioExt = audioMime.includes('mp4') ? '.m4a' : '.webm';

async function startRecording() {
    try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        var opts = audioMime ? { mimeType: audioMime } : {};
        mediaRec = new MediaRecorder(stream, opts);
        var actualMime = mediaRec.mimeType || audioMime || 'audio/webm';
        audioChunks = []; recSec = 0;
        mediaRec.ondataavailable = function(e) { if (e.data.size>0) audioChunks.push(e.data); };
        mediaRec.onstop = function() {
            stream.getTracks().forEach(function(t){t.stop();});
            var blob = new Blob(audioChunks, { type: actualMime });
            attachments.push({ type:'audio', blob:blob, blobUrl:URL.createObjectURL(blob), mime:actualMime, ext:audioExt });
            renderAttachments();
            checkSubmit();
            document.getElementById('rec-overlay').classList.add('hidden');
        };
        mediaRec.start();
        document.getElementById('rec-overlay').classList.remove('hidden');
        document.getElementById('rec-time').textContent = '0:00';
        recTimer = setInterval(function() {
            recSec++;
            document.getElementById('rec-time').textContent = Math.floor(recSec/60)+':'+(recSec%60<10?'0':'')+recSec%60;
        }, 1000);
    } catch(e) { showErr('microphone denied'); }
}

function stopRecording() {
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    if (mediaRec) mediaRec.stop();
}

// ── Submit ──
async function submitCapture() {
    // If editing a queue item, save back and return
    if (editingIdx >= 0) {
        finishEdit();
        return;
    }

    var body = document.getElementById('cap-body').value.trim();
    var title = document.getElementById('cap-title').value.trim();

    var captureData = {
        mode: captureMode,
        from: captureMode === 'rec' ? (document.getElementById('rec-from').value.trim() || null) : null,
        kind: captureMode === 'rec' ? chipValue('rec-kind') : null,
        form: captureMode === 'seed' ? chipValue('seed-form') : null,
        threads: selectedThreads.slice(),
        newThread: captureMode === 'seed' ? newThreadName : null,
        body: body || null,
        title: title || null,
        photos: attachments.filter(a => a.type==='photo').map(a => ({ blob:a.blob, mime:a.mime, name:a.name, thumb:a.thumb })),
        audios: attachments.filter(a => a.type==='audio').map(a => ({ blob:a.blob, mime:a.mime||'audio/webm', ext:a.ext||'.webm' })),
    };

    if (offlineMode) {
        try {
            await addToQueue(captureData);
        } catch(e) {
            showErr('queue save failed: ' + e.message);
            return;
        }
        resetForm();
        showSuccess(true);
        return;
    }

    // Online — single unified upload
    try {
        var res = await fetchTimeout('/api/capture', buildFormForItem(captureData));
        showSuccess(false, res.id);
        resetForm();
    } catch(e) {
        // Failed — queue it
        try { await addToQueue(captureData); } catch(qe) { showErr('upload and queue both failed: ' + e.message); return; }
        resetForm();
        showSuccess(true);
    }
}

async function fetchTimeout(url, formData) {
    var ctrl = new AbortController();
    var t = setTimeout(() => ctrl.abort(), 30000);
    var res = await fetch(url, { method:'POST', body:formData, signal:ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error(res.status);
    return await res.json();
}

function showSuccess(queued, id) {
    document.getElementById('suc-icon').style.background = queued ? 'var(--amber)' : 'var(--matcha)';
    document.getElementById('suc-icon').textContent = queued ? '↻' : '✓';
    document.getElementById('suc-text').textContent = queued ? 'saved to queue' : 'captured';
    document.getElementById('suc-detail').textContent = queued ? queue.length + ' items waiting' : (id ? id.substring(0,8) : '');
    showView('success');
}

function resetForm() {
    document.getElementById('cap-body').value = '';
    document.getElementById('cap-title').value = '';
    var rf = document.getElementById('rec-from'); if (rf) rf.value = '';
    var ss = document.getElementById('seed-search'); if (ss) ss.value = '';
    document.querySelectorAll('.chip-row .chip.on').forEach(function(c) { c.classList.remove('on'); });
    selectedThreads = [];
    newThreadName = null;
    if (captureMode === 'seed') renderThreads();
    attachments.forEach(a => { if (a.blobUrl) URL.revokeObjectURL(a.blobUrl); });
    attachments = [];
    renderAttachments();
    checkSubmit();
}

function resetCapture() {
    resetForm();
    showView('capture');
}

// ── Queue ──
async function addToQueue(data) {
    var item = { data:data, timestamp:new Date().toISOString(), id:Date.now()+Math.random() };
    await idbPut(item);
    queue.push(item);
    updateBadge();
    updateStorage();
}

async function removeQ(id) {
    await idbDelete(id);
    queue = queue.filter(q => q.id !== id);
    renderQueue();
    updateBadge();
    updateStorage();
}

async function clearQueue() {
    if (!confirm('Delete all ' + queue.length + ' queued items?')) return;
    await idbClear();
    queue = [];
    renderQueue();
    updateBadge();
    updateStorage();
}

async function updateStorage() {
    var el = document.getElementById('q-storage');
    if (!el) return;
    var est = await idbEstimateUsage();
    var usedMB = (est.used / 1024 / 1024).toFixed(1);
    var quotaMB = (est.quota / 1024 / 1024).toFixed(0);
    var pct = est.quota > 0 ? Math.min(100, (est.used / est.quota) * 100).toFixed(0) : '?';
    el.innerHTML = 'storage: ' + usedMB + 'MB / ' + quotaMB + 'MB (' + pct + '%) · ' + queue.length + ' items'
        + (queue.length > 0 ? ' · <span style="cursor:pointer;text-decoration:underline;" onclick="clearQueue()">clear queue</span>' : '');
    el.style.color = pct > 80 ? 'var(--red)' : 'var(--slate)';
}

function editQ(id) {
    editingIdx = queue.findIndex(q => q.id === id);
    if (editingIdx < 0) return;
    var item = queue[editingIdx];

    // Load into capture form
    document.getElementById('cap-body').value = item.data.body || '';
    document.getElementById('cap-title').value = item.data.title || '';

    // Load attachments
    attachments.forEach(a => { if (a.blobUrl) URL.revokeObjectURL(a.blobUrl); });
    attachments = [];

    (item.data.photos || []).forEach(function(p) {
        attachments.push({ type:'photo', blob:p.blob, mime:p.mime, name:p.name, thumb:p.thumb });
    });
    (item.data.audios || []).forEach(function(a) {
        attachments.push({ type:'audio', blob:a.blob, blobUrl:URL.createObjectURL(a.blob), mime:a.mime, ext:a.ext });
    });

    renderAttachments();
    checkSubmit();

    // Show edit bar, change button text
    document.getElementById('edit-bar').classList.remove('hidden');
    document.getElementById('cap-submit').textContent = 'update queued item';

    showView('capture');
}

function cancelEdit() {
    editingIdx = -1;
    document.getElementById('edit-bar').classList.add('hidden');
    document.getElementById('cap-submit').textContent = 'capture';
    resetForm();
}

async function finishEdit() {
    var body = document.getElementById('cap-body').value.trim();
    var title = document.getElementById('cap-title').value.trim();

    queue[editingIdx].data = {
        body: body || null,
        title: title || null,
        photos: attachments.filter(a => a.type==='photo').map(a => ({ blob:a.blob, mime:a.mime, name:a.name, thumb:a.thumb })),
        audios: attachments.filter(a => a.type==='audio').map(a => ({ blob:a.blob, mime:a.mime||'audio/webm', ext:a.ext||'.webm' })),
    };
    try {
        await idbPut(queue[editingIdx]);
    } catch(e) {
        showErr('Storage full — cannot save changes');
        return;
    }

    editingIdx = -1;
    document.getElementById('edit-bar').classList.add('hidden');
    document.getElementById('cap-submit').textContent = 'capture';
    resetForm();
    showView('queue');
}

async function deleteEditing() {
    if (editingIdx < 0) return;
    var id = queue[editingIdx].id;
    editingIdx = -1;
    document.getElementById('edit-bar').classList.add('hidden');
    document.getElementById('cap-submit').textContent = 'capture';
    resetForm();
    await removeQ(id);
    showView('queue');
}

function updateBadge() {
    var el = document.getElementById('queue-count');
    if (queue.length > 0) { el.textContent = queue.length + ' queued'; el.classList.remove('hidden'); }
    else { el.classList.add('hidden'); }
}

function renderQueue() {
    var list = document.getElementById('q-list');
    document.getElementById('q-empty').style.display = queue.length ? 'none' : 'block';
    document.getElementById('q-actions').classList.toggle('hidden', queue.length === 0);
    updateStorage();

    list.innerHTML = queue.map(function(item) {
        var d = item.data;
        var html = '<div class="q-item">';
        html += '<div class="q-type">capture</div>';
        if (d.body) html += '<div class="q-text">' + esc(d.body.substring(0,120)) + '</div>';
        if (d.photos && d.photos.length) {
            html += '<div class="q-photos">' + d.photos.map(function(p) {
                return '<img src="' + p.thumb + '">';
            }).join('') + '</div>';
        }
        if (d.audios && d.audios.length) html += '<div class="q-text" style="color:var(--slate);">🎙 ' + d.audios.length + ' voice</div>';
        html += '<div class="q-time">' + new Date(item.timestamp).toLocaleString() + '</div>';
        html += '<div class="q-actions">'
            + '<button class="btn" onclick="editQ('+item.id+')">edit</button>'
            + '<button class="btn" onclick="syncOne('+item.id+')">sync</button>'
            + '<button class="btn btn-danger" onclick="removeQ('+item.id+')">remove</button>'
            + '</div>';
        html += '</div>';
        return html;
    }).join('');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildFormForItem(d) {
    var f = new FormData();
    if (d.body) f.append('body', d.body);
    if (d.title) f.append('title', d.title);
    if (d.mode && d.mode !== 'note') f.append('mode', d.mode);
    if (d.from) f.append('from', d.from);
    if (d.kind) f.append('kind', d.kind);
    if (d.form) f.append('form', d.form);
    // Thread ids and a pending new-thread name ride along with the queued item,
    // so a note captured offline still lands in the right song after sync.
    if (d.threads && d.threads.length) f.append('threads', d.threads.join(','));
    if (d.newThread) { f.append('new_thread', d.newThread); f.append('new_thread_kind', 'song'); }
    for (var p of (d.photos||[])) f.append('file', p.blob, p.name || 'photo.jpg');
    for (var a of (d.audios||[])) f.append('file', a.blob, 'recording' + (a.ext||'.webm'));
    return f;
}

async function syncOne(id) {
    var item = queue.find(q => q.id === id);
    if (!item) return;
    try {
        await fetchTimeout('/api/capture', buildFormForItem(item.data));
        removeQ(item.id);
        showErr('');
    } catch(e) {
        showErr('sync failed: ' + e.message);
    }
}

async function syncQueue() {
    var synced=0, failed=0;
    var items = [...queue];

    for (var item of items) {
        try {
            await fetchTimeout('/api/capture', buildFormForItem(item.data));
            removeQ(item.id);
            synced++;
        } catch(e) { failed++; }
    }

    if (failed) showErr('synced ' + synced + ', failed ' + failed);
    else { showErr(''); renderQueue(); }
}

// ── Recs ──
// Grouping happens client side over the same flat list: person, medium and
// date are three lenses, not three storage layouts.
var recsCache = null;

function setRecGroup(el, g) {
    recGroup = g;
    document.querySelectorAll('#view-recs .chip').forEach(function(c) { c.classList.remove('on'); });
    el.classList.add('on');
    renderRecs();
}

async function loadRecs() {
    try {
        var r = await fetch('/api/recs');
        recsCache = await r.json();
    } catch (e) {
        recsCache = null;
    }
    renderRecs();
}

var KIND_ICON = { book:'▤', film:'▶', music:'♪', place:'⌖', other:'·' };

function renderRecs() {
    var el = document.getElementById('recs-body');
    if (recsCache === null) { el.innerHTML = '<div class="empty-msg">offline — recs need the server</div>'; return; }
    if (!recsCache.length) { el.innerHTML = '<div class="empty-msg">no recs yet</div>'; return; }

    var groups = {};
    recsCache.forEach(function(r) {
        var key;
        if (recGroup === 'from') key = r.from || 'unattributed';
        else if (recGroup === 'kind') key = r.kind || 'other';
        else key = new Date(r.createdAt).toLocaleDateString(undefined, { year:'numeric', month:'long' });
        (groups[key] = groups[key] || []).push(r);
    });

    var keys = Object.keys(groups);
    // Date groups read newest-first; the others biggest-first.
    if (recGroup === 'date') keys.sort(function(a,b) { return new Date(groups[b][0].createdAt) - new Date(groups[a][0].createdAt); });
    else keys.sort(function(a,b) { return groups[b].length - groups[a].length; });

    el.innerHTML = keys.map(function(k) {
        var rows = groups[k].map(function(r) {
            var icon = KIND_ICON[r.kind] || '·';
            var aside = recGroup === 'from' ? (r.kind || '') : (r.from || '');
            return '<div class="rec-row"><span>' + icon + '</span><span>' + esc(r.title || r.body || 'untitled') + '</span>'
                + (aside ? '<span class="meta">' + esc(aside) + '</span>' : '') + '</div>';
        }).join('');
        return '<div class="group-head"><span>' + esc(k.toUpperCase()) + '</span><span class="n">' + groups[k].length + '</span></div>' + rows;
    }).join('');
}

// ── Init ──
(async function() {
    try {
        // Migrate from localStorage if any
        var old = localStorage.getItem('noto-q');
        if (old) {
            var oldItems = JSON.parse(old);
            for (var item of oldItems) { await idbPut(item); }
            localStorage.removeItem('noto-q');
        }

        // Load queue from IndexedDB
        queue = await idbGetAll();
    } catch(e) {
        showErr('Failed to load queue: ' + e.message);
    }
    updateBadge();
    updateStorage();
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw-capture.js').catch(function(){});

// Threads for the seed picker. Cached in localStorage so the picker still
// works on a walk with no signal — a stale list beats an empty one.
async function loadThreads() {
    try {
        var r = await fetch('/api/threads');
        threads = await r.json();
        try { localStorage.setItem('noto-threads', JSON.stringify(threads)); } catch(e) {}
    } catch (e) {
        try { threads = JSON.parse(localStorage.getItem('noto-threads') || '[]'); } catch(e2) { threads = []; }
    }
    if (captureMode === 'seed') renderThreads();
}

// Who you have credited before, newest first. Learned rather than configured.
async function loadRecentPeople() {
    try {
        var r = await fetch('/api/recs');
        var recs = await r.json();
        var seen = [];
        recs.forEach(function(x) {
            if (x.from && seen.indexOf(x.from) < 0) seen.push(x.from);
        });
        recentPeople = seen;
        try { localStorage.setItem('noto-people', JSON.stringify(seen)); } catch(e) {}
    } catch (e) {
        try { recentPeople = JSON.parse(localStorage.getItem('noto-people') || '[]'); } catch(e2) { recentPeople = []; }
    }
    if (captureMode === 'rec') renderRecentPeople();
}

loadThreads();
loadRecentPeople();

// Load templates
var templateCache = [];
fetch('/api/templates').then(r=>r.json()).then(function(tpls) {
    templateCache = tpls;
    var sel = document.getElementById('tpl-select');
    tpls.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.title;
        sel.appendChild(opt);
    });
}).catch(function(){});

function applyTemplate(sel) {
    var tpl = templateCache.find(t => t.id === sel.value);
    if (!tpl) return;
    var body = document.getElementById('cap-body');
    body.value = body.value ? body.value + '\n\n' + tpl.body : tpl.body;
    sel.value = '';
    checkSubmit();
}

fetch('/api/version').then(r=>r.json()).then(d=>{
    document.getElementById('ver').textContent = d.hash;
}).catch(function(){
    document.getElementById('ver').textContent = 'offline';
});
